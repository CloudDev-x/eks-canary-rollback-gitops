apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: 746491202337.dkr.ecr.us-east-1.amazonaws.com/eks-canary-rollback/api:4318a18d
          ports:
            - containerPort: 8080
          env:
            - name: FAIL_RATE
              value: "0"
            - name: APP_VERSION
              value: "4318a18d"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
