apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: apps
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: 746491202337.dkr.ecr.us-east-1.amazonaws.com/eks-canary-rollback/api:4318a18d
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FAIL_RATE
              value: "1"
            - name: APP_VERSION
              value: "4318a18d"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
  strategy:
    canary:
      stableService: api-stable
      canaryService: api-canary
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: api-5xx-rate
            args:
              - name: canary_hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 100
