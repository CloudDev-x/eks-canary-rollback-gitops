apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: busybox:1.37.0
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://api/ || true; sleep 0.2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
