apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: 746491202337.dkr.ecr.us-east-1.amazonaws.com/eks-canary-rollback/worker:9a0ccf98
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
